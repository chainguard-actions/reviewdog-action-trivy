name: Test missing trivy_target errors out
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          trivy_command: config
          trivy_target: ''
          reporter: local
      - name: Assert step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRIVY_RC: ${{ steps.action.outputs.trivy-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trivy-return-code: '$TRIVY_RC'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when trivy_target is empty"
            exit 1
          fi
          if [ -n "$TRIVY_RC" ]; then
            echo "FAIL: trivy should not have run"
            exit 1
          fi
          echo "PASS"
