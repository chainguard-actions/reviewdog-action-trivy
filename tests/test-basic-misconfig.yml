name: Test basic config scan finding misconfigurations
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          trivy_command: config
          trivy_target: .
          trivy_version: latest
          working_directory: tests/fixtures/misconfig
          reporter: local
          filter_mode: nofilter
          fail_level: none
      - name: Assert trivy found issues and reviewdog succeeded
        env:
          TRIVY_RC: ${{ steps.action.outputs.trivy-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "trivy-return-code: $TRIVY_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$TRIVY_RC" != "1" ]; then
            echo "FAIL: expected trivy-return-code 1 (misconfigurations found)"
            exit 1
          fi
          if [ "$REVIEWDOG_RC" != "0" ]; then
            echo "FAIL: expected reviewdog-return-code 0 with fail_level none"
            exit 1
          fi
          echo "PASS"
