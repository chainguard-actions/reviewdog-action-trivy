name: Test config scan of clean directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          trivy_command: config
          trivy_target: .
          trivy_version: latest
          working_directory: tests/fixtures/clean
          reporter: local
          filter_mode: nofilter
          fail_level: any
      - name: Assert no issues found
        env:
          TRIVY_RC: ${{ steps.action.outputs.trivy-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "trivy-return-code: $TRIVY_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$TRIVY_RC" != "0" ]; then
            echo "FAIL: expected trivy-return-code 0 for clean directory"
            exit 1
          fi
          if [ "$REVIEWDOG_RC" != "0" ]; then
            echo "FAIL: expected reviewdog-return-code 0"
            exit 1
          fi
          echo "PASS"
