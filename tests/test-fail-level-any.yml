name: Test fail_level any fails the step on findings
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          trivy_command: config
          trivy_target: .
          trivy_version: latest
          working_directory: tests/fixtures/misconfig
          reporter: local
          filter_mode: nofilter
          level: error
          fail_level: any
      - name: Assert step failed due to findings
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TRIVY_RC: ${{ steps.action.outputs.trivy-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trivy-return-code: $TRIVY_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected step to fail with fail_level any"
            exit 1
          fi
          if [ "$TRIVY_RC" != "1" ]; then
            echo "FAIL: expected trivy-return-code 1"
            exit 1
          fi
          if [ "$REVIEWDOG_RC" != "1" ]; then
            echo "FAIL: expected reviewdog-return-code 1"
            exit 1
          fi
          echo "PASS"
