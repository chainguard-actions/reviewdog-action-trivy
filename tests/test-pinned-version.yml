name: Test pinned trivy version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github_token: ${{ github.token }}
          trivy_command: filesystem
          trivy_target: .
          trivy_version: v0.57.0
          reporter: local
          filter_mode: nofilter
          fail_level: none
          trivy_flags: '--scanners misconfig'
        continue-on-error: true

      - name: Assert action ran and outputs are set or action failed gracefully
        env:
          TRIVY_RC: ${{ steps.action.outputs.trivy-return-code }}
          REVIEWDOG_RC: ${{ steps.action.outputs.reviewdog-return-code }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "trivy-return-code: $TRIVY_RC"
          echo "reviewdog-return-code: $REVIEWDOG_RC"
          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded — outputs must be set
            if [ -z "$TRIVY_RC" ]; then
              echo "FAIL: action succeeded but trivy-return-code output is empty"
              exit 1
            fi
            if [ -z "$REVIEWDOG_RC" ]; then
              echo "FAIL: action succeeded but reviewdog-return-code output is empty"
              exit 1
            fi
            echo "PASS: trivy-return-code=$TRIVY_RC reviewdog-return-code=$REVIEWDOG_RC"
          elif [ "$OUTCOME" = "failure" ]; then
            # Action failed — acceptable (network issues, sentinel repo, etc.)
            echo "PASS: action failed gracefully (outcome=failure is acceptable)"
            if [ -n "$TRIVY_RC" ] && [ -n "$REVIEWDOG_RC" ]; then
              echo "INFO: outputs were set: trivy-return-code=$TRIVY_RC reviewdog-return-code=$REVIEWDOG_RC"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
